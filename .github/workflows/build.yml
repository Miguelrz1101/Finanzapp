name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto
        run: |
          sudo apt-get install -y imagemagick
          mkdir www
          cp index.html www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @aparajita/capacitor-biometric-auth@8 esbuild
          echo 'import {BiometricAuth} from "@aparajita/capacitor-biometric-auth"; window.Bio={check:()=>BiometricAuth.checkBiometry(),auth:()=>BiometricAuth.authenticate({reason:"Entrar a FinanzApp",cancelTitle:"Cancelar",allowDeviceCredential:false,androidTitle:"FinanzApp",androidSubtitle:"Usa tu huella para entrar",androidConfirmationRequired:false})};' > bio-entry.js
          npx esbuild bio-entry.js --bundle --format=iife --minify --outfile=www/bio.js
          npx cap init "FinanzApp" com.finanzapp.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Iconos y nombre
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*' -delete
          mkdir -p $R/drawable-nodpi $R/mipmap-anydpi-v26
          convert icon-background.png -resize 432x432 $R/drawable-nodpi/ic_launcher_bg.png
          convert icon-foreground.png -resize 432x432 $R/drawable-nodpi/ic_launcher_fg.png
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $R/mipmap-$n
            convert icon-only.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            convert icon-only.png -resize ${s}x${s} -alpha set \( -size ${s}x${s} xc:none -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -compose DstIn -composite $R/mipmap-$n/ic_launcher_round.png
          done
          for f in ic_launcher ic_launcher_round; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '  <background android:drawable="@drawable/ic_launcher_bg"/>' '  <foreground android:drawable="@drawable/ic_launcher_fg"/>' '</adaptive-icon>' > $R/mipmap-anydpi-v26/$f.xml
          done
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">FinanzApp</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">FinanzApp</string>|' $R/values/strings.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FinanzApp.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FinanzApp v${{ github.run_number }}
          files: FinanzApp.apk
