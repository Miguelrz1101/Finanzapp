<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinanzApp</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e6e2d8;--inc:#12a37a;--exp:#e5484d;--acc:#5b4bdb;--accT:#fff;--sh:0 6px 24px rgba(30,30,60,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1f2b;--ink:#eef0f6;--mut:#9aa1b5;--line:#2a2f3f;--inc:#2dd4a0;--exp:#ff6b70;--acc:#8b7dff;--accT:#12141c;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1f2b;--ink:#eef0f6;--mut:#9aa1b5;--line:#2a2f3f;--inc:#2dd4a0;--exp:#ff6b70;--acc:#8b7dff;--accT:#12141c;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:1.25rem;margin:0;letter-spacing:-.02em}
.tools{display:flex;gap:6px}
.tools select,.ib{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-size:.85rem}
.month{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.month button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.1rem}
.month b{min-width:150px;text-align:center;font-size:1.05rem;text-transform:capitalize}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.span{grid-column:1/-1}}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--acc),#c15bd8);color:#fff;position:relative;overflow:hidden}
.hero small{opacity:.85}
.hero .bal{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.row2{display:flex;gap:10px}
.pill{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;position:relative;z-index:1}
.pill span{display:block;font-size:.75rem;opacity:.9}.pill b{font-size:1.05rem}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .5s}
h2{font-size:.95rem;margin:0 0 12px;color:var(--mut);font-weight:600}
.chart{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut{width:160px;height:160px;position:relative}
.donut svg{transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;color:var(--mut)}
.donut div b{font-size:1rem;color:var(--ink)}
.leg{flex:1;min-width:150px;display:grid;gap:7px;font-size:.85rem}
.leg p{margin:0;display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg em{margin-left:auto;font-style:normal;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:7px 14px;border-radius:99px;background:var(--bg);font-size:.85rem;border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);animation:in .3s}
.tx:last-child{border:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;background:var(--bg);flex:none}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--mut)}
.amt{font-weight:700;font-size:.95rem}.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}
.del{opacity:.4;font-size:1rem;padding:6px}.del:hover{opacity:1}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.empty button{margin-top:10px;background:var(--bg);border:1px solid var(--line);padding:9px 14px;border-radius:12px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--accT);font-size:2rem;box-shadow:0 10px 26px rgba(91,75,219,.45);transition:transform .2s;z-index:5}
.fab:active{transform:scale(.92)}
dialog{border:0;padding:0;background:transparent;width:100%;max-width:100%;margin:auto 0 0;color:var(--ink)}
dialog::backdrop{background:rgba(10,10,20,.55)}
.sheet{background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:11px;font-weight:600}
.seg button.on.e{background:var(--exp);color:#fff}.seg button.on.i{background:var(--inc);color:#fff}
.big{width:100%;font-size:2rem;font-weight:800;text-align:center;border:0;background:transparent;color:var(--ink);outline:none;margin-bottom:8px}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.cats button{padding:7px 11px;border-radius:99px;border:1px solid var(--line);font-size:.82rem;background:var(--bg)}
.cats button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.f{display:flex;gap:8px;margin-bottom:14px}
.f input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.save{width:100%;padding:14px;border-radius:16px;background:var(--acc);color:var(--accT);font-weight:700;font-size:1rem}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.toast.on{opacity:1}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fx input,.fx select{min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.fx .w{grid-column:1/-1}
.fx button{grid-column:1/-1;padding:12px;border-radius:14px;background:var(--acc);color:var(--accT);font-weight:700}
@media(min-width:560px){.fx{grid-template-columns:2fr 1fr 1fr 1.4fr auto}.fx .w,.fx button{grid-column:auto}}
.ftot{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ftot h2{margin:0}.ftot b{color:var(--exp)}
.tag{font-size:.7rem;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:4px}
.wa{position:relative;z-index:1;margin-top:12px;width:100%;padding:11px;border-radius:14px;background:#25d366;color:#08331a;font-weight:700}
#loanview{display:none}
body.loan #loanview{display:block}
body.loan .month,body.loan .grid,body.loan .fab{display:none!important}
.lf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lf label{display:grid;gap:4px;font-size:.78rem;color:var(--mut)}
.lf input,.lf select{min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.lf button{grid-column:1/-1;padding:13px;border-radius:14px;background:var(--acc);color:var(--accT);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--bg);border-radius:14px;padding:10px;font-size:.72rem;color:var(--mut)}
.sum b{display:block;color:var(--ink);font-size:.95rem;margin-top:2px}
.sched{max-height:420px;overflow-y:auto}
.adv{display:flex;gap:12px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.4rem;flex:none}
.say{flex:1;background:var(--bg);border-radius:6px 20px 20px 20px;padding:14px 16px;font-size:.9rem;line-height:1.45}
.say ul{margin:8px 0 0;padding-left:18px;display:grid;gap:7px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700;color:#fff}
.meter{height:8px;background:var(--line);border-radius:8px;margin:10px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:8px;transition:width .5s}
header{flex-wrap:wrap}
#lock{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
#lock.on{display:flex}
.lbox{width:100%;max-width:380px;text-align:center}
.lbox .logo{font-size:3.4rem}
.lbox h1{font-size:1.5rem;margin:6px 0}
.lbox p{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.lbox input{width:100%;margin-bottom:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:center}
#lmsg{color:var(--exp);min-height:1.3em;font-size:.85rem;margin:2px 0 8px}
.link{color:var(--mut);font-size:.82rem;text-decoration:underline;margin-top:14px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#set .sheet{max-height:88vh;overflow:auto}
.sheet h3{font-size:.95rem;margin:18px 0 8px}
.sheet .sinp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.sb{width:100%;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-weight:600;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💸 FinanzApp</h1>
    <div class="tools"><button class="ib" id="loanbtn">🏦 Préstamos</button>
      <select id="cur" aria-label="Moneda"><option>EUR</option><option>USD</option><option>MXN</option><option>COP</option><option>ARS</option><option>CLP</option><option>PEN</option></select>
      <button class="ib" id="theme" aria-label="Cambiar tema">🌓</button><button class="ib" id="setbtn" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <div class="month"><button id="prev" aria-label="Mes anterior">‹</button><b id="mlabel"></b><button id="next" aria-label="Mes siguiente">›</button></div>
  <div class="grid">
    <section class="card hero span">
      <small>Balance del mes</small>
      <div class="bal" id="bal">0</div>
      <div class="row2">
        <div class="pill"><span>⬆ Ingresos</span><b id="inc">0</b></div>
        <div class="pill"><span>⬇ Gastos</span><b id="exp">0</b></div>
      </div>
      <div class="bar"><i id="barfill" style="width:0"></i></div>
      <small id="hint" style="display:block;margin-top:8px"></small>
      <button class="wa" id="wa">📲 Enviar resumen por WhatsApp</button>
    </section>
    <section class="card span"><div class="adv"><div class="av">🤖</div><div class="say" id="adv"></div></div></section>
    <section class="card">
      <h2>Gastos por categoría</h2>
      <div class="chart">
        <div class="donut"><svg viewBox="0 0 36 36" width="160" height="160" id="svg"></svg><div><span>Total</span><b id="dtot">0</b></div></div>
        <div class="leg" id="leg"></div>
      </div>
    </section>
    <section class="card">
      <h2>Movimientos</h2>
      <div class="tabs" id="tabs"><button data-f="all" class="on">Todos</button><button data-f="income">Ingresos</button><button data-f="expense">Gastos</button></div>
      <div id="list"></div>
    </section>
    <section class="card span">
      <div class="ftot"><h2>📌 Gastos fijos mensuales</h2><b id="ftotal">0</b></div>
      <div class="fx">
        <input id="fname" class="w" placeholder="Nombre (alquiler, Netflix…)" maxlength="30">
        <input id="famt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Importe">
        <input id="fday" type="number" inputmode="numeric" min="1" max="28" placeholder="Día (1-28)">
        <select id="fcat"></select>
        <button id="fadd">Añadir fijo</button>
      </div>
      <div id="flist"></div>
      <div id="llist"></div>
      <small style="color:var(--mut)">Se suman automáticamente cada mes desde el mes en que los añades.</small>
    </section>
  </div>
<section class="card" id="loanview">
    <h2>🏦 Cotizador de préstamos</h2>
    <div class="lf">
      <label>Cantidad<input id="lamt" type="number" inputmode="decimal" min="0" placeholder="10000"></label>
      <label>Interés (%)<input id="lrate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="12"></label>
      <label>Tipo de tasa<select id="ltype"><option value="anual">Anual</option><option value="mensual">Mensual</option></select></label>
      <label>Frecuencia de pago<select id="lfreq"><option value="mensual">Mensual</option><option value="quincenal">Quincenal</option><option value="semanal">Semanal</option></select></label>
      <label style="grid-column:1/-1">Nombre del préstamo (opcional)<input id="lname" maxlength="30" placeholder="Ej: Préstamo del carro"></label>
      <label style="grid-column:1/-1">Sistema de pago<select id="lsys"><option value="cuota">Cuota fija (el interés baja, el capital sube)</option><option value="fijo">Capital fijo (el interés y la cuota bajan)</option></select></label>
      <label style="grid-column:1/-1">Número de pagos<input id="ln" type="number" inputmode="numeric" min="1" max="360" placeholder="12"></label>
      <button id="lcalc">Calcular proyección</button>
      <button id="lclear" style="background:var(--bg);color:var(--ink);border:1px solid var(--line)">🧹 Limpiar</button>
    </div>
    <div id="lres"></div>
  </section>
</div>
<button class="fab" id="fab" aria-label="Añadir movimiento">+</button>
<div class="toast" id="toast"></div>

<div id="lock"><div class="lbox" id="lbox">
  <div class="logo"><svg viewBox='0 0 1024 1024' width='96' height='96' style='border-radius:24px;box-shadow:0 8px 24px rgba(91,75,219,.35)'><defs><linearGradient id='lg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#5b4bdb'/><stop offset='1' stop-color='#c15bd8'/></linearGradient></defs><rect width='1024' height='1024' fill='url(#lg)'/><circle cx='880' cy='140' r='260' fill='#fff' fill-opacity='.12'/><circle cx='512' cy='512' r='250' fill='#fff'/><rect x='430' y='380' width='64' height='264' rx='32' fill='#5b4bdb'/><rect x='430' y='380' width='180' height='64' rx='32' fill='#5b4bdb'/><rect x='430' y='480' width='140' height='64' rx='32' fill='#12a37a'/><circle cx='700' cy='330' r='72' fill='#12a37a' stroke='#fff' stroke-width='12'/><path d='M700 366V298M672 324l28-28 28 28' fill='none' stroke='#fff' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/><path d='M300 270l12 30 30 12-30 12-12 30-12-30-30-12 30-12z' fill='#fff'/></svg></div><h1 id="lt"></h1><p id="ls"></p>
  <input id="lu" placeholder="Usuario" autocomplete="username" maxlength="24">
  <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password">
  <input id="lp2" type="password" placeholder="Repite la contraseña" autocomplete="new-password">
  <div id="lmsg"></div>
  <button class="save" id="lgo">Entrar</button>
  <button class="link" id="lforgot">Olvidé mi contraseña</button>
</div></div>

<dialog id="set"><div class="sheet">
  <h2 style="margin-bottom:4px">⚙️ Ajustes</h2>
  <small style="color:var(--mut)">Sesión de <b id="suser"></b></small>
  <h3>🔐 Seguridad</h3>
  <input class="sinp" id="cp0" type="password" placeholder="Contraseña actual" autocomplete="off">
  <input class="sinp" id="cp1" type="password" placeholder="Nueva contraseña (mín. 4)" autocomplete="off">
  <button class="sb" id="cpgo">Cambiar contraseña</button>
  <button class="sb" id="slock">🔒 Bloquear ahora</button>
  <h3>💾 Respaldo</h3>
  <small id="slast" style="color:var(--mut);display:block;margin-bottom:8px"></small>
  <button class="sb" id="bcopy">📋 Copiar respaldo</button>
  <button class="sb" id="bwa">📲 Enviar respaldo por WhatsApp</button>
  <textarea class="sinp" id="btext" rows="3" placeholder="Pega aquí un respaldo para restaurarlo"></textarea>
  <input class="sinp" id="bfile" type="file" accept=".json,.txt,text/plain,application/json">
  <button class="sb" id="bres">♻️ Restaurar respaldo</button>
</div></dialog>
<dialog id="dlg">
  <div class="sheet">
    <div class="seg" id="seg"><button class="on e" data-t="expense">Gasto</button><button data-t="income">Ingreso</button></div>
    <input class="big" id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00">
    <div class="cats" id="cats"></div>
    <div class="f"><input id="desc" placeholder="Descripción (opcional)" maxlength="40"><input id="date" type="date"></div>
    <button class="save" id="save">Guardar</button>
  </div>
</dialog>

<script>
const CATS={
 expense:[["Vivienda","🏠","#5b4bdb"],["Comida","🍽️","#f59e0b"],["Transporte","🚗","#0ea5e9"],["Ocio","🎉","#ec4899"],["Salud","💊","#10b981"],["Compras","🛍️","#a855f7"],["Servicios","💡","#eab308"],["Deudas","💳","#ef4444"],["Otros","📦","#94a3b8"]],
 income:[["Salario","💼","#12a37a"],["Freelance","💻","#0ea5e9"],["Inversión","📈","#a855f7"],["Regalo","🎁","#ec4899"],["Otros","💰","#94a3b8"]]};
const $=id=>document.getElementById(id);
let S={tx:[],fixed:[],loans:[],cur:"EUR",theme:""};
try{const r=localStorage.getItem("finanzas-v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("finanzas-v1",JSON.stringify(S))}catch(e){}};
let view=new Date();view.setDate(1);
let filter="all",type="expense",cat="Vivienda";
const fmt=n=>{try{return new Intl.NumberFormat("es",{style:"currency",currency:S.cur,maximumFractionDigits:2}).format(n)}catch(e){return n.toFixed(2)}};
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const info=(t,c)=>CATS[t].find(x=>x[0]===c)||CATS[t][CATS[t].length-1];
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}

function monthTx(key){
  const real=S.tx.filter(t=>t.date.startsWith(key));
  const fx=S.fixed.filter(f=>f.start<=key).map(f=>({id:"f"+f.id,type:"expense",amt:f.amt,cat:f.cat,desc:f.name,fixed:1,date:key+"-"+String(f.day).padStart(2,"0")}));
  S.loans.forEach(l=>l.pays.forEach((p,k)=>{if(p.date.startsWith(key))fx.push({id:"l"+l.id+"_"+k,type:"expense",amt:p.amt,cat:"Deudas",desc:l.name+" ("+(k+1)+"/"+l.pays.length+")",fixed:1,date:p.date})}));
  return real.concat(fx);
}
function renderFixed(){
  const tot=S.fixed.reduce((a,f)=>a+f.amt,0);
  $("ftotal").textContent=fmt(tot)+" / mes";
  $("flist").innerHTML=S.fixed.length?S.fixed.map(f=>`<div class="tx"><div class="ic">${info("expense",f.cat)[1]}</div><div class="m"><b>${esc(f.name)}</b><small>${f.cat} · día ${f.day} de cada mes</small></div><span class="amt e">−${fmt(f.amt)}</span><button class="del" data-fid="${f.id}" aria-label="Eliminar fijo">✕</button></div>`).join(""):'<div class="empty">Aún no tienes gastos fijos.</div>';
}
function renderLoans(){
  const f=s=>new Date(s+"T12:00").toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"});
  $("llist").innerHTML=S.loans.map(l=>`<div class="tx"><div class="ic">💳</div><div class="m"><b>${esc(l.name)}</b><small>${l.pays.length} cuotas · hasta ${f(l.pays[l.pays.length-1].date)}</small></div><span class="amt e">−${fmt(l.pays[0].amt)}</span><button class="del" data-lid="${l.id}" aria-label="Eliminar préstamo">✕</button></div>`).join("");
}
function advice(all,inc,exp){
  const el=$("adv"),sum=f=>all.filter(f).reduce((a,t)=>a+t.amt,0);
  if(!all.length){el.innerHTML="Hola 👋 Registra tus ingresos y gastos de este mes y te daré recomendaciones para cuidar tu salud financiera.";return}
  if(!(inc>0)){el.innerHTML="Aún no tienes ingresos este mes. Añádelos para calcular tu nivel de endeudamiento y darte recomendaciones 📈";return}
  const debt=sum(t=>t.type==="expense"&&t.cat==="Deudas"),fx=sum(t=>t.fixed),fun=sum(t=>t.type==="expense"&&(t.cat==="Ocio"||t.cat==="Compras"));
  const dr=debt/inc*100,er=exp/inc*100,sr=(inc-exp)/inc*100,fr=fx/inc*100,fp=fun/inc*100,R=Math.round;
  const lv=dr<=15?["Saludable","var(--inc)"]:dr<=35?["Moderado","#f59e0b"]:["Alto","var(--exp)"];
  const T=[];
  if(dr>35)T.push("⚠️ Tus deudas consumen el "+R(dr)+"% de tus ingresos y lo recomendable es máximo 35%. Evita pedir nuevos créditos y paga primero la deuda con mayor interés.");
  else if(dr>15)T.push("Tus deudas son el "+R(dr)+"% de tus ingresos. Antes de pedir otro préstamo, intenta bajar de 15% y no uses crédito para gastos del día a día.");
  else if(debt>0)T.push("✅ Tu deuda ("+R(dr)+"%) está bajo control. Si puedes, haz pagos extra al capital para ahorrar intereses.");
  else T.push("✅ No tienes deudas este mes, ¡excelente! Si piensas pedir un préstamo, procura que la cuota no pase del 15% de tus ingresos.");
  if(er>100)T.push("🚨 Gastas más de lo que ganas (déficit de "+fmt(exp-inc)+"). Recorta gastos variables antes de endeudarte para cubrir el mes.");
  else if(sr<10)T.push("Solo ahorras el "+R(sr)+"%. Apunta a 10-20% con la regla 50/30/20: 50% necesidades, 30% gustos y 20% ahorro o deudas.");
  else if(sr>=20)T.push("👏 Ahorras el "+R(sr)+" % de tus ingresos, ¡muy bien! Mantén el hábito y automatiza ese ahorro.");
  if(fr>50)T.push("Tus gastos fijos ocupan el "+R(fr)+"% de tus ingresos. Intenta mantenerlos bajo 50% para tener margen ante imprevistos.");
  if(fp>30)T.push("Ocio y compras suman el "+R(fp)+"% de tus ingresos. Fija un tope mensual para esos gastos.");
  T.splice(3);T.push("🛡️ Fondo de emergencia: apunta a "+fmt(exp*3)+" – "+fmt(exp*6)+" (3 a 6 meses de gastos).");
  el.innerHTML=`<span class="chip" style="background:${lv[1]}">Endeudamiento ${lv[0]}: ${R(dr)}%</span><div class="meter"><i style="width:${Math.min(100,dr/50*100)}%;background:${lv[1]}"></i></div><small style="color:var(--mut)">Meta: deudas por debajo del 35% de tus ingresos</small><ul>${T.map(x=>"<li>"+x+"</li>").join("")}</ul>`;
}
function render(){
  $("cur").value=S.cur;renderFixed();renderLoans();
  $("mlabel").textContent=view.toLocaleDateString("es",{month:"long",year:"numeric"});
  const key=ym(view);
  const all=monthTx(key).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  const inc=all.filter(t=>t.type==="income").reduce((a,t)=>a+t.amt,0);
  const exp=all.filter(t=>t.type==="expense").reduce((a,t)=>a+t.amt,0);
  $("bal").textContent=fmt(inc-exp);$("inc").textContent=fmt(inc);$("exp").textContent=fmt(exp);
  const pct=inc>0?Math.min(100,exp/inc*100):(exp>0?100:0);
  $("barfill").style.width=pct+"%";advice(all,inc,exp);
  $("hint").textContent=inc>0?(exp<=inc?"Has gastado el "+Math.round(pct)+"% de tus ingresos 👍":"Gastas más de lo que ingresas ⚠️"):"Añade tus ingresos para ver tu ritmo de gasto";
  // donut
  const by={};all.filter(t=>t.type==="expense").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let off=0,svg='<circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--line)" stroke-width="4"/>',leg="";
  ent.forEach(([c,v])=>{const p=v/exp*100,col=info("expense",c)[2];
    svg+=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${Math.max(p-.8,.1)} ${100-Math.max(p-.8,.1)}" stroke-dashoffset="${-off}"/>`;
    off+=p;leg+=`<p><i style="background:${col}"></i>${info("expense",c)[1]} ${c}<em>${Math.round(p)}%</em></p>`});
  $("svg").innerHTML=svg;$("dtot").textContent=fmt(exp);
  $("leg").innerHTML=leg||'<p style="color:var(--mut)">Sin gastos este mes</p>';
  // list
  const rows=all.filter(t=>filter==="all"||t.type===filter);
  $("list").innerHTML=rows.length?rows.map(t=>{const i=info(t.type,t.cat);
    const d=new Date(t.date+"T12:00").toLocaleDateString("es",{day:"numeric",month:"short"});
    return `<div class="tx"><div class="ic">${i[1]}</div><div class="m"><b>${esc(t.desc||t.cat)}</b><small>${t.cat} · ${d}${t.fixed?'<span class="tag">📌 fijo</span>':""}</small></div><span class="amt ${t.type[0]}">${t.type==="income"?"+":"−"}${fmt(t.amt)}</span>${t.fixed?"":`<button class="del" data-id="${t.id}" aria-label="Eliminar">✕</button>`}</div>`}).join(""):
    `<div class="empty">Aún no hay movimientos.${S.tx.length?"":'<br><button id="demo">✨ Cargar ejemplo</button>'}</div>`;
}

function waOpen(text){
  const u="https://wa.me/?text="+encodeURIComponent(text);
  let w=null;try{w=window.open(u,"_blank")}catch(e){}
  if(!w){try{navigator.clipboard.writeText(text);toast("Texto copiado, pégalo en WhatsApp")}catch(e){location.href=u}}

function monthText(){
  const key=ym(view),all=monthTx(key).sort((a,b)=>a.date.localeCompare(b.date));
  const inc=all.filter(t=>t.type==="income").reduce((a,t)=>a+t.amt,0),exp=all.filter(t=>t.type==="expense").reduce((a,t)=>a+t.amt,0);
  const fx=S.fixed.filter(f=>f.start<=key).reduce((a,f)=>a+f.amt,0);
  const by={};all.filter(t=>t.type==="expense").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  const L=["*📊 Resumen de "+$("mlabel").textContent+"*","","💰 Ingresos: "+fmt(inc),"💸 Gastos: "+fmt(exp),"⚖️ Balance: "+fmt(inc-exp)];
  if(fx)L.push("📌 Gastos fijos: "+fmt(fx));
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(ent.length){L.push("","*Gastos por categoría*");ent.forEach(([c,v])=>L.push("• "+info("expense",c)[1]+" "+c+": "+fmt(v)+" ("+Math.round(v/exp*100)+"%)"))}
  L.push("","*Movimientos*");
  all.forEach(t=>L.push((t.type==="income"?"➕ ":"➖ ")+t.date.slice(8)+" "+(t.desc||t.cat)+": "+fmt(t.amt)));
  L.push("","_Enviado desde FinanzApp_");
  return L.join("\n");
}
$("wa").onclick=()=>{

$("loanbtn").onclick=()=>{
  const on=document.body.classList.toggle("loan");
  $("loanbtn").textContent=on?"← Volver":"🏦 Préstamos";window.scrollTo(0,0);

let loanTxt="",loanSched=[];
$("lcalc").onclick=()=>{
  const P=parseFloat($("lamt").value),r=parseFloat($("lrate").value||"0"),n=parseInt($("ln").value,10),fq=$("lfreq").value;
  if(!(P>0)){$("lamt").focus();toast("Introduce la cantidad");return}
  if(!(r>=0)){$("lrate").focus();toast("Interés no válido");return}
  if(!(n>=1&&n<=360)){$("ln").focus();toast("Pagos entre 1 y 360");return}
  const ppy={mensual:12,quincenal:24,semanal:52}[fq];
  const i=($("ltype").value==="anual"?r/100:r/100*12)/ppy;
  const pay=i>0?P*i/(1-Math.pow(1+i,-n)):P/n;
  const sys=$("lsys").value,pay1=sys==="fijo"?P/n+P*i:pay;
  let bal=P,tot=0,rows="";const start=new Date(),L=[];loanSched=[];
  for(let k=1;k<=n;k++){
    const int=bal*i;let cap=sys==="fijo"?P/n:pay-int;if(k===n)cap=bal;
    const cuota=cap+int;bal=Math.max(0,bal-cap);tot+=cuota;
    const d=new Date(start);
    if(fq==="mensual")d.setMonth(d.getMonth()+k);else d.setDate(d.getDate()+k*(fq==="quincenal"?15:7));
    const ds=d.toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"});
    rows+=`<div class="tx"><div class="ic" style="font-size:.9rem;font-weight:700">${k}</div><div class="m"><b>${ds}</b><small>Capital ${fmt(cap)} · Interés ${fmt(int)} · Saldo ${fmt(bal)}</small></div><span class="amt">${fmt(cuota)}</span></div>`;
    L.push(k+". "+ds+" — "+fmt(cuota)+" (saldo "+fmt(bal)+")");
    loanSched.push({date:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),amt:cuota});
  }
  $("lres").innerHTML=`<div class="sum"><div>${sys==="fijo"?"Primer pago":"Pago "+fq}<b>${fmt(pay1)}</b></div><div>Total a pagar<b>${fmt(tot)}</b></div><div>Intereses<b>${fmt(tot-P)}</b></div></div><div class="sched">${rows}</div><button class="save" id="lwa" style="margin-top:12px;background:#25d366;color:#08331a">📲 Compartir cotización</button><button class="save" id="ladd" style="margin-top:8px">💳 Es mi préstamo: agregar cuotas a gastos fijos</button>`;
  loanTxt=["*🏦 Cotización de préstamo*","","Cantidad: "+fmt(P),"Interés: "+r+"% "+$("ltype").value,"Pagos "+fq+"es: "+n,(sys==="fijo"?"Primer pago: ":"Pago "+fq+": ")+fmt(pay1),"Total a pagar: "+fmt(tot),"Intereses: "+fmt(tot-P),"","*Proyección*"].concat(L).join("\n");
  $("lwa").onclick=()=>waOpen(loanTxt);
  $("ladd").onclick=()=>{
    S.loans.push({id:Date.now(),name:$("lname").value.trim()||"Préstamo",pays:loanSched.slice()});
    save();render();toast("Cuotas agregadas a gastos fijos 💳");
  };
};

  $("ltype").value="anual";$("lfreq").value="mensual";$("lsys").value="cuota";

$("flist").onclick=e=>{const d=e.target.closest(".del");if(d){S.fixed=S.fixed.filter(f=>f.id!=d.dataset.fid);save();render();toast("Gasto fijo eliminado")}};
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem("finanzas-auth")||"null")}catch(e){}
const saveAuth=()=>{try{localStorage.setItem("finanzas-auth",JSON.stringify(AUTH))}catch(e){}};
function newSalt(){try{return Array.from(crypto.getRandomValues(new Uint8Array(12))).join("")}catch(e){return String(Math.random()).slice(2)+Date.now()}}
async function hp(pw,salt){
  try{if(crypto&&crypto.subtle){
    const enc=new TextEncoder(),k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:100000},k,256);
    return btoa(String.fromCharCode(...new Uint8Array(bits)));
  }}catch(e){}
  let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "x"+h;
}
function showLock(){
  const setup=!AUTH;
  $("lock").classList.add("on");document.querySelector(".wrap").inert=true;
  $("lt").textContent=setup?"Crea tu acceso":"Hola, "+AUTH.user+" 👋";
  $("ls").textContent=setup?"Protege tus finanzas con usuario y contraseña. Se guardan solo en este dispositivo.":"Ingresa tu contraseña para continuar";
  $("lu").style.display=$("lp2").style.display=setup?"":"none";
  $("lforgot").style.display=setup?"none":"";
  $("lgo").textContent=setup?"Crear acceso":"Entrar";
  $("lforgot").textContent="Olvidé mi contraseña";forgotArmed=false;
  $("lu").value="";$("lp").value="";$("lp2").value="";$("lmsg").textContent="";
}
function unlock(){$("lock").classList.remove("on");document.querySelector(".wrap").inert=false;$("lp").value="";$("lp2").value=""}
let forgotArmed=false;
$("lgo").onclick=async()=>{
  const pw=$("lp").value,msg=$("lmsg");
  if(!AUTH){
    const u=$("lu").value.trim();
    if(!u){msg.textContent="Escribe un nombre de usuario";return}
    if(pw.length<4){msg.textContent="La contraseña debe tener al menos 4 caracteres";return}
    if(pw!==$("lp2").value){msg.textContent="Las contraseñas no coinciden";return}
    const salt=newSalt();AUTH={user:u,salt,hash:await hp(pw,salt)};saveAuth();unlock();toast("¡Bienvenido, "+u+"! 🎉");
  }else if(await hp(pw,AUTH.salt)===AUTH.hash){unlock()}
  else{msg.textContent="Contraseña incorrecta";$("lp").value="";const b=$("lbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}
};
["lu","lp","lp2"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("lgo").click()}));
$("lforgot").onclick=()=>{
  if(!forgotArmed){forgotArmed=true;$("lforgot").textContent="Esto borrará TODOS tus datos. Toca otra vez para confirmar";return}
  try{localStorage.removeItem("finanzas-v1");localStorage.removeItem("finanzas-auth")}catch(e){}
  S={tx:[],fixed:[],loans:[],cur:"EUR",theme:""};AUTH=null;render();showLock();
};
$("setbtn").onclick=()=>{
  $("suser").textContent=AUTH?AUTH.user:"";
  $("slast").textContent=S.lastBackup?"Último respaldo: "+new Date(S.lastBackup).toLocaleString("es"):"Aún no has hecho un respaldo";
  $("set").showModal();
};
$("set").onclick=e=>{if(e.target===$("set"))$("set").close()};
$("slock").onclick=()=>{$("set").close();showLock()};
$("cpgo").onclick=async()=>{
  const a=$("cp0").value,b=$("cp1").value;
  if(await hp(a,AUTH.salt)!==AUTH.hash){toast("Contraseña actual incorrecta");return}
  if(b.length<4){toast("Mínimo 4 caracteres");return}
  AUTH.salt=newSalt();AUTH.hash=await hp(b,AUTH.salt);saveAuth();$("cp0").value="";$("cp1").value="";toast("Contraseña actualizada 🔐");
};
const backupStr=()=>{S.lastBackup=new Date().toISOString();save();return JSON.stringify({app:"mis-finanzas",v:1,fecha:S.lastBackup,data:S})};
$("bcopy").onclick=async()=>{
  const t=backupStr();
  try{await navigator.clipboard.writeText(t);toast("Respaldo copiado 📋")}catch(e){$("btext").value=t;$("btext").select();toast("Copia el texto manualmente")}
};
$("bwa").onclick=()=>waOpen("Respaldo FinanzApp:\n"+backupStr());
$("bfile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("btext").value=r.result;toast("Archivo cargado, toca Restaurar")};r.readAsText(f)};
let armed=false;
$("bres").onclick=()=>{
  let o=null;try{o=JSON.parse($("btext").value.trim().replace(/^[^{]*/,""))}catch(e){}
  if(!o||o.app!=="mis-finanzas"||!o.data||!Array.isArray(o.data.tx)){toast("Respaldo no válido");return}
  if(!armed){armed=true;$("bres").textContent="¿Reemplazar tus datos? Toca otra vez";setTimeout(()=>{armed=false;$("bres").textContent="♻️ Restaurar respaldo"},4000);return}
  S=Object.assign({tx:[],fixed:[],loans:[],cur:"EUR",theme:""},o.data);save();armed=false;$("bres").textContent="♻️ Restaurar respaldo";$("btext").value="";render();toast("Datos restaurados ✅");
};
render();showLock();
</script>
