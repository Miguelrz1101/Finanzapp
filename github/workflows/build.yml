name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto
        run: |
          mkdir www assets
          cp index.html www/
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm i -D @capacitor/assets
          npx cap init "FinanzApp" com.finanzapp.app --web-dir www
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FinanzApp.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FinanzApp v${{ github.run_number }}
          files: FinanzApp.apk
